<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Sudoku Grid</title>

<style>
body{
  margin:0;
  font-family: monospace;
  background:#06142E;
  color:white;
  text-align:center;
}

h1{
  color:#D4AF37;
  margin-top:20px;
}

.controls{
  margin:10px;
}

select, button{
  padding:10px;
  margin:5px;
  background:#0A1F44;
  color:white;
  border:1px solid #334155;
  cursor:pointer;
  border-radius:6px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(9,40px);
  justify-content:center;
  margin-top:20px;
  gap:2px;
}

input{
  width:40px;
  height:40px;
  text-align:center;
  font-size:18px;
  background:#0A1F44;
  color:white;
  border:1px solid #334155;
}

input.fixed{
  background:#102A5C;
  color:#D4AF37;
  font-weight:bold;
}

input.error{
  background:#7f1d1d;
}

#msg{
  margin-top:15px;
}

/* MODAL */
.modal{
  display:none;
  position:fixed;
  top:0; left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.8);
  justify-content:center;
  align-items:center;
}

.modal-content{
  background:#0A1F44;
  padding:20px;
  border:1px solid #D4AF37;
  max-width:400px;
  text-align:left;
  border-radius:10px;
}

.close{
  float:right;
  cursor:pointer;
  color:#D4AF37;
}
</style>
</head>

<body>

<h1>🧩 Neon Sudoku Grid</h1>

<div class="controls">
  <button onclick="newGame()">New Game</button>
  <button onclick="hint()">Hint 💡</button>
  <button onclick="check()">Check</button>
  <button onclick="openModal()">Instructions 📖</button>
</div>

<div class="grid" id="grid"></div>

<div id="msg"></div>

<!-- INSTRUCTIONS MODAL -->
<div class="modal" id="modal">
  <div class="modal-content">
    <span class="close" onclick="closeModal()">✖</span>
    <h3>How to Play</h3>
    <p>Fill the grid so that every row, column, and 3×3 box contains numbers 1–9.</p>
    <p>Rules:</p>
    <ul>
      <li>No repeated numbers in a row</li>
      <li>No repeated numbers in a column</li>
      <li>No repeated numbers in 3×3 boxes</li>
    </ul>
    <p>Use Hint if you're stuck.</p>
  </div>
</div>

<script>
const puzzle = [
[5,3,0,0,7,0,0,0,0],
[6,0,0,1,9,5,0,0,0],
[0,9,8,0,0,0,0,6,0],
[8,0,0,0,6,0,0,0,3],
[4,0,0,8,0,3,0,0,1],
[7,0,0,0,2,0,0,0,6],
[0,6,0,0,0,0,2,8,0],
[0,0,0,4,1,9,0,0,5],
[0,0,0,0,8,0,0,7,9]
];

const solution = [
[5,3,4,6,7,8,9,1,2],
[6,7,2,1,9,5,3,4,8],
[1,9,8,3,4,2,5,6,7],
[8,5,9,7,6,1,4,2,3],
[4,2,6,8,5,3,7,9,1],
[7,1,3,9,2,4,8,5,6],
[9,6,1,5,3,7,2,8,4],
[2,8,7,4,1,9,6,3,5],
[3,4,5,2,8,6,1,7,9]
];

const grid = document.getElementById("grid");

function newGame(){
  grid.innerHTML = "";

  for(let r=0;r<9;r++){
    for(let c=0;c<9;c++){
      let inp = document.createElement("input");

      if(puzzle[r][c] !== 0){
        inp.value = puzzle[r][c];
        inp.disabled = true;
        inp.classList.add("fixed");
      }

      inp.dataset.r = r;
      inp.dataset.c = c;

      grid.appendChild(inp);
    }
  }
}

function check(){
  let inputs = document.querySelectorAll("input");
  let ok = true;

  inputs.forEach(i=>{
    let r = i.dataset.r;
    let c = i.dataset.c;

    if(!i.disabled && i.value != solution[r][c]){
      ok = false;
      i.classList.add("error");
    }
  });

  document.getElementById("msg").innerText =
    ok ? "🎉 Solved!" : "❌ Try again";
}

function hint(){
  let inputs = document.querySelectorAll("input:not([disabled])");

  for(let i of inputs){
    if(i.value == ""){
      let r = i.dataset.r;
      let c = i.dataset.c;
      i.value = solution[r][c];
      break;
    }
  }
}

/* MODAL */
function openModal(){
  document.getElementById("modal").style.display = "flex";
}

function closeModal(){
  document.getElementById("modal").style.display = "none";
}

newGame();
</script>

</body>
</html>

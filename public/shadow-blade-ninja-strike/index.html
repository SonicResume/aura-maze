<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Shinobi Survivor 🥷</title>
  <style>
    /* =========================================================================
       🎨 RETRO CYBERPUNK SHINOBI BRAND DESIGN ALIGNMENT
       ========================================================================= */
    body {
      margin: 0;
      background: #0b0c10;
      color: #fff;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }
    #ui {
      font-size: 28px;
      margin-bottom: 12px;
      font-weight: bold;
      letter-spacing: 2px;
      text-shadow: 0 0 10px #4ade80;
    }
    #canvas-container {
      position: relative;
    }
    canvas {
      border: 4px solid #1f2937;
      background: #111827;
      box-shadow: 0 0 30px rgba(74, 222, 128, 0.15);
      border-radius: 12px;
    }

    /* 🎮 GAME OVER SCREEN OVERLAY MODAL */
    #game-over-screen {
      position: absolute;
      inset: 0;
      background: rgba(11, 12, 16, 0.95);
      display: none; /* Regulated via operational state engine */
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 15px;
      border-radius: 12px;
      z-index: 10;
    }

    #game-over-title {
      font-size: 40px;
      font-weight: 900;
      color: #ef4444;
      text-shadow: 0 0 15px rgba(239, 68, 68, 0.4);
      letter-spacing: 2px;
    }

    /* 🎨 RESTART BUTTON SPEC: Yellow Fill background, bold White font */
    .btn-restart {
      padding: 12px 24px;
      background: #d4af37 !important;
      color: #ffffff !important;
      border: none;
      border-radius: 8px;
      font-weight: 900;
      font-family: 'Courier New', Courier, monospace;
      cursor: pointer;
      text-transform: uppercase;
      font-size: 14px;
      letter-spacing: 1px;
      transition: background-color 0.2s, transform 0.1s;
      margin-top: 10px;
      box-shadow: 0 4px 12px rgba(212, 175, 55, 0.2);
    }

    .btn-restart:hover {
      background: #fbbf24 !important;
    }

    .btn-restart:active {
      transform: scale(0.96);
    }

    /* ⬅️ BASELINE NAVIGATION LINK CONTAINER */
    #menu-container {
      text-align: center; 
      margin-top: 20px; 
      position: relative; 
      z-index: 9999;
    }

    #back-btn {
      display: inline-block; 
      padding: 12px 24px; 
      background: #111827; 
      border: 2px solid #1f2937; 
      border-radius: 8px; 
      color: #d4af37; 
      text-decoration: none; 
      font-weight: bold; 
      font-size: 13px; 
      text-transform: uppercase; 
      letter-spacing: 1px; 
      transition: background 0.2s, border-color 0.2s;
    }

    #back-btn:hover {
      border-color: #4ade80; 
      background: #1f2937;
      color: #ffffff;
    }
  </style>
</head>
<body>

  <div id="ui">🥷 SHINOBI SCORE: <span id="score">0</span></div>
  
  <div id="canvas-container">
    <canvas id="gameCanvas" width="800" height="600"></canvas>

    <!-- Restart Console overlay screen overlay structure -->
    <div id="game-over-screen">
      <h2 id="game-over-title">SHINOBI DEFEATED</h2>
      <p style="font-size: 20px; color: #ffffff;">FINAL NINJA SCORE: <span id="final-score" style="color: #d4af37;">0</span></p>
      <button class="btn-restart" onclick="resetShinobiEngine()">Respawn Shinobi</button>
    </div>
  </div>

  <!-- Menu button layout position fixed below canvas element workspace -->
  <div id="menu-container">
    <a id="back-btn" href="../index.html">⬅️ Menu</a>
  </div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const scoreEl = document.getElementById("score");
    const gameOverScreen = document.getElementById("game-over-screen");
    const finalScoreEl = document.getElementById("final-score");

    let score = 0;
    let gameOver = false;
    let animationFrameId = null;

    const player = {
      x: canvas.width / 2,
      y: canvas.height / 2,
      width: 24,
      height: 32,
      speed: 4.5,
      animTimer: 0
    };

    const keys = {};
    window.addEventListener("keydown", (e) => keys[e.key.toLowerCase()] = true);
    window.addEventListener("keyup", (e) => keys[e.key.toLowerCase()] = false);

    let shurikens = [];
    let rivals = [];
    let particles = [];

    let lastShotTime = 0;
    const throwRate = 350;

    let lastSpawnTime = 0;
    const spawnRate = 800;

    // Pixel Art Renderer: Draw the Player Shinobi
    function drawShinobi(p) {
      ctx.save();
      ctx.translate(p.x, p.y);
      
      // Animation bobbing effect
      let bob = Math.sin(p.animTimer * 0.15) * 2;
      
      // 1. Ninja Scarf Trailing Behind
      ctx.fillStyle = "#1e3a8a"; // Deep Blue Scarf
      ctx.fillRect(-16, 6 + bob, 12, 6);
      ctx.fillRect(-22, 10 + bob, 10, 4);

      // 2. Black Stealth Suit Body
      ctx.fillStyle = "#1f2937"; 
      ctx.fillRect(-10, -2 + bob, 20, 24); // Torso
      ctx.fillStyle = "#111827"; 
      ctx.fillRect(-12, 22, 8, 10);        // Left Leg
      ctx.fillRect(4, 22, 8, 10);         // Right Leg

      // 3. Ninja Masked Head
      ctx.fillStyle = "#1f2937";
      ctx.fillRect(-12, -20 + bob, 24, 18); // Head base
      
      // 4. Glowing Blue Eyes/Visor Slit
      ctx.fillStyle = "#60a5fa";
      ctx.fillRect(-6, -14 + bob, 14, 4);

      ctx.restore();
    }

    // Pixel Art Renderer: Draw Rival Rogue Ninjas
    function drawRival(r) {
      ctx.save();
      ctx.translate(r.x, r.y);

      // Red Rogue Outfit
      ctx.fillStyle = "#991b1b"; 
      ctx.fillRect(-8, -2, 16, 20); // Body
      ctx.fillRect(-9, 18, 6, 8);   // Legs
      ctx.fillRect(3, 18, 6, 8);

      // Masked Head
      ctx.fillRect(-10, -16, 20, 14);
      
      // Angry Mask Accent Line
      ctx.fillStyle = "#f87171";
      ctx.fillRect(-8, -10, 16, 3);
      ctx.fillStyle = "#111827"; // Dark Eyes
      ctx.fillRect(-4, -11, 2, 2);
      ctx.fillRect(2, -11, 2, 2);

      ctx.restore();
    }

    function drawShuriken(x, y, rotation) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(rotation);
      ctx.fillStyle = "#fbbf24"; // Bright Steel Gold
      
      ctx.beginPath();
      for (let i = 0; i < 4; i++) {
        ctx.lineTo(0, -9);
        ctx.lineTo(3, -3);
        ctx.rotate(Math.PI / 2);
      }
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    function addExplosion(x, y, color) {
      for(let i=0; i<8; i++){
        particles.push({
          x: x, y: y,
          vx: (Math.random() - 0.5) * 4,
          vy: (Math.random() - 0.5) * 4,
          radius: Math.random() * 4 + 2,
          alpha: 1,
          color: color
        });
      }
    }

    function update(currentTime) {
      if (gameOver) return;

      animationFrameId = requestAnimationFrame(update);
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Move player and track animation clock
      let moving = false;
      if (keys["w"] || keys["arrowup"]) { player.y -= player.speed; moving = true; }
      if (keys["s"] || keys["arrowdown"]) { player.y += player.speed; moving = true; }
      if (keys["a"] || keys["arrowleft"]) { player.x -= player.speed; moving = true; }
      if (keys["d"] || keys["arrowright"]) { player.x += player.speed; moving = true; }

      if (moving) player.animTimer++;

      player.x = Math.max(16, Math.min(canvas.width - 16, player.x));
      player.y = Math.max(24, Math.min(canvas.height - 32, player.y));

      drawShinobi(player);

      // Auto throw logic
      if (rivals.length > 0 && currentTime - lastShotTime > throwRate) {
        let closest = rivals[0];
        let minDist = Infinity;
        rivals.forEach(r => {
          let d = Math.hypot(r.x - player.x, r.y - player.y);
          if (d < minDist) { minDist = d; closest = r; }
        });

        const angle = Math.atan2(closest.y - player.y, closest.x - player.x);
        shurikens.push({ x: player.x, y: player.y, vx: Math.cos(angle) * 9, vy: Math.sin(angle) * 9, rot: 0 });
        lastShotTime = currentTime;
      }

      // Render Shurikens
      for (let i = shurikens.length - 1; i >= 0; i--) {
        const s = shurikens[i];
        s.x += s.vx; s.y += s.vy; s.rot += 0.25;
        drawShuriken(s.x, s.y, s.rot);
        if (s.x < 0 || s.x > canvas.width || s.y < 0 || s.y > canvas.height) shurikens.splice(i, 1);
      }

      // Spawning Rivals
      if (currentTime - lastSpawnTime > spawnRate) {
        let x = Math.random() < 0.5 ? 0 : canvas.width;
        let y = Math.random() * canvas.height;
        rivals.push({ x, y, speed: 2 + Math.random() * 1 });
        lastSpawnTime = currentTime;
      }

      // Handle Rivals behavior
      for (let i = rivals.length - 1; i >= 0; i--) {
        const r = rivals[i];
        const angle = Math.atan2(player.y - r.y, player.x - r.x);
        r.x += Math.cos(angle) * r.speed;
        r.y += Math.sin(angle) * r.speed;

        drawRival(r);

        // Collision Check (Lose)
        if (Math.hypot(player.x - r.x, player.y - r.y) < 24) {
          triggerTerminationSequence();
          return;
        }

        // Collision Check (Hit enemy)
        for (let j = shurikens.length - 1; j >= 0; j--) {
          const s = shurikens[j];
          if (Math.hypot(s.x - r.x, s.y - r.y) < 18) {
            addExplosion(r.x, r.y, "#ef4444"); // Red smoke explosion!
            addExplosion(r.x, r.y, "#9ca3af");
            rivals.splice(i, 1);
            shurikens.splice(j, 1);
            score += 50;
            scoreEl.textContent = score;
            break;
          }
        }
      }

          // Draw active smoke particles
      for(let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx; p.y += p.vy; p.alpha -= 0.03;
        if(p.alpha <= 0) { particles.splice(i,1); continue; }
        ctx.save();
        ctx.globalAlpha = p.alpha;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI*2);
        ctx.fill();
        ctx.restore();
      }
    }

    function triggerTerminationSequence() {
      gameOver = true;
      cancelAnimationFrame(animationFrameId);
      finalScoreEl.textContent = score;
      gameOverScreen.style.display = "flex";
    }

    function resetShinobiEngine() {
      score = 0;
      gameOver = false;
      shurikens = [];
      rivals = [];
      particles = [];
      
      player.x = canvas.width / 2;
      player.y = canvas.height / 2;
      player.animTimer = 0;
      
      scoreEl.textContent = score;
      gameOverScreen.style.display = "none";
      
      requestAnimationFrame(update);
    }

    // Boot Runtime Loop Trigger
    requestAnimationFrame(update);
  </script>
</body>
</html>

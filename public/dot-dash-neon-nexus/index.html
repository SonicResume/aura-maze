<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Aura Canvas Survivor | Arcade</title>
  <style>
    /* =========================================================================
       🎨 NOAH WORKSPACE BRAND DESIGN ALIGNMENT
       ========================================================================= */
    body {
      margin: 0;
      background: #06142E; /* Matching slate midnight blue */
      color: #fff;
      font-family: monospace; /* Terminal typography */
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }
    
    /* HUD Layout */
    #ui {
      font-size: 16px;
      margin-bottom: 15px;
      font-weight: bold;
      display: flex;
      gap: 30px;
      letter-spacing: 2px;
    }
    
    .gold-text {
      color: #d4af37;
    }

    .timer-text {
      color: #ef4444;
    }

    #canvas-container {
      position: relative;
    }

    canvas {
      border: 4px solid #0a1f44;
      background: #030712;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      border-radius: 12px;
    }

   /* ⬅️ MENU NAVIGATION CONTROL STYLING */
    #menu-container {
      margin-bottom: 15px;
      width: 800px;
      max-width: 95vw;
      display: flex;
      justify-content: flex-start;
    }

    #back-btn { 
      color: #d4af37; text-decoration: none; font-weight: bold; 
      background: #0A1F44; padding: 10px 20px; border-radius: 8px; 
      font-size: 14px; border: 2px solid #1e293b; text-transform: uppercase;
      font-family: monospace; letter-spacing: 1px; transition: all 0.2s;
    }
    #back-btn:hover { border-color: #38bdf8; color: #fff; background: #111827; }


    /* 🎮 GAME OVER SCREEN OVERLAY MODAL */
    #game-over-screen {
      position: absolute;
      inset: 0;
      background: rgba(6, 20, 46, 0.9);
      display: none; /* Controlled by engine state */
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 15px;
      border-radius: 12px;
      z-index: 10;
    }

    #game-over-title {
      font-size: 36px;
      letter-spacing: 4px;
      font-weight: 900;
    }

    /* 🎨 RESTART BUTTON SPEC: Yellow Fill background, bold White font */
    .btn-restart {
      padding: 12px 24px;
      background: #d4af37 !important;
      color: #ffffff !important;
      border: none;
      border-radius: 8px;
      font-weight: 900;
      font-family: monospace;
      cursor: pointer;
      text-transform: uppercase;
      font-size: 14px;
      letter-spacing: 1px;
      transition: background-color 0.2s, transform 0.1s;
      margin-top: 10px;
      box-shadow: 0 4px 12px rgba(212, 175, 55, 0.2);
    }

    .btn-restart:hover {
      background: #fbbf24 !important;
    }

    .btn-restart:active {
      transform: scale(0.96);
    }
  </style>
</head>
<body>

  <!-- Game HUD -->
  <div id="ui">
    <div>TIME LEFT: <span id="timer" class="timer-text">60</span>s</div>
    <div>SCORE: <span id="score" class="gold-text">0</span></div>
    <div>HIGH SCORE: <span id="highScore" class="gold-text">0</span></div>
  </div>

  <div id="canvas-container">
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    
    <!-- Restart Console overlay screen -->
    <div id="game-over-screen">
      <h2 id="game-over-title">SYSTEM OVER</h2>
      <p style="font-size: 16px;">MATCH SCORE: <span id="final-score" class="gold-text">0</span></p>
      <p style="font-size: 14px; color: #94a3b8;">BEST RECORD: <span id="final-high" class="gold-text">0</span></p>
      <button class="btn-restart" onclick="resetGameEngine()">Restart Console</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const scoreEl = document.getElementById("score");
    const timerEl = document.getElementById("timer");
    const highScoreEl = document.getElementById("highScore");
    const gameOverScreen = document.getElementById("game-over-screen");
    const gameOverTitle = document.getElementById("game-over-title");
    const finalScoreEl = document.getElementById("final-score");
    const finalHighEl = document.getElementById("final-high");

    // Game Core Variables
    let score = 0;
    let timeRemaining = 60; // ⏱️ 60 Second Match Timer Variable
    let highScore = parseInt(localStorage.getItem("survivor_high_score")) || 0;
    let gameOver = false;
    let animationFrameId = null;
    let countdownIntervalId = null;

    // Entities registries
    let projectiles = [];
    let enemies = [];
    let lastShotTime = 0;
    let lastSpawnTime = 0;
    const fireRate = 400; 
    const spawnRate = 1000; 

    // Render High Score baseline value to layout on file boot
    highScoreEl.textContent = highScore;

    // Player Configuration object
    const player = {
      x: canvas.width / 2,
      y: canvas.height / 2,
      radius: 15,
      speed: 4,
      color: "#00ffcc"
    };

    // Input tracking maps
    const keys = {};
    window.addEventListener("keydown", (e) => keys[e.key.toLowerCase()] = true);
    window.addEventListener("keyup", (e) => keys[e.key.toLowerCase()] = false);

    // ⏱️ CLOCK TRACKING DOWN: Automatically loops down match time metrics
    function startTimerCountdown() {
      if (countdownIntervalId) clearInterval(countdownIntervalId);
      countdownIntervalId = setInterval(() => {
        if (!gameOver) {
          timeRemaining--;
          timerEl.textContent = timeRemaining;

          if (timeRemaining <= 0) {
            triggerTerminationSequence("TIME_EXPIRED");
          }
        }
      }, 1000);
    }

    // Engine loop lifecycle
    function update(currentTime) {
      if (gameOver) return;

      animationFrameId = requestAnimationFrame(update);

      // 1. Clear Canvas
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 2. Handle Player Movement
      if (keys["w"] || keys["arrowup"]) player.y -= player.speed;
      if (keys["s"] || keys["arrowdown"]) player.y += player.speed;
      if (keys["a"] || keys["arrowleft"]) player.x -= player.speed;
      if (keys["d"] || keys["arrowright"]) player.x += player.speed;

      // Bound locks
      player.x = Math.max(player.radius, Math.min(canvas.width - player.radius, player.x));
      player.y = Math.max(player.radius, Math.min(canvas.height - player.radius, player.y));

      // Draw Player
      ctx.beginPath();
      ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
      ctx.fillStyle = player.color;
      ctx.fill();
      ctx.closePath();

      // 3. Automated Combat processing
      if (enemies.length > 0 && currentTime - lastShotTime > fireRate) {
        let closestEnemy = enemies[0];
        let minDist = Infinity;

        enemies.forEach(enemy => {
          const dist = Math.hypot(enemy.x - player.x, enemy.y - player.y);
          if (dist < minDist) {
            minDist = dist;
            closestEnemy = enemy;
          }
        });

        const angle = Math.atan2(closestEnemy.y - player.y, closestEnemy.x - player.x);
        
        projectiles.push({
          x: player.x,
          y: player.y,
          vx: Math.cos(angle) * 7,
          vy: Math.sin(angle) * 7,
          radius: 5,
          color: "#ffff00"
        });

        lastShotTime = currentTime;
      }

      // Projectile updates
      for (let i = projectiles.length - 1; i >= 0; i--) {
        const p = projectiles[i];
        p.x += p.vx;
        p.y += p.vy;

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.fill();
        ctx.closePath();

        if (p.x < 0 || p.x > canvas.width || p.y < 0 || p.y > canvas.height) {
          projectiles.splice(i, 1);
        }
      }

      // 4. Enemy Spawning mechanics
      if (currentTime - lastSpawnTime > spawnRate) {
        let x, y;
        if (Math.random() < 0.5) {
          x = Math.random() < 0.5 ? 0 : canvas.width;
          y = Math.random() * canvas.height;
        } else {
          x = Math.random() * canvas.width;
          y = Math.random() < 0.5 ? 0 : canvas.height;
        }

        enemies.push({
          x: x,
          y: y,
          radius: 12,
          speed: 1.5 + Math.random() * 1,
          color: "#ff3366"
        });

        lastSpawnTime = currentTime;
      }

      // Enemy updates and cross tracking loops
      for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];

        const angle = Math.atan2(player.y - e.y, player.x - e.x);
        e.x += Math.cos(angle) * e.speed;
        e.y += Math.sin(angle) * e.speed;

        ctx.beginPath();
        ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2);
        ctx.fillStyle = e.color;
        ctx.fill();
        ctx.closePath();

        const distToPlayer = Math.hypot(player.x - e.x, player.y - e.y);
        if (distToPlayer < player.radius + e.radius) {
          triggerTerminationSequence("PLAYER_DIED");
        }

        for (let j = projectiles.length - 1; j >= 0; j--) {
          const p = projectiles[j];
          const distToBullet = Math.hypot(p.x - e.x, p.y - e.y);

          if (distToBullet < p.radius + e.radius) {
            enemies.splice(i, 1);
            projectiles.splice(j, 1);
            score += 10;
            scoreEl.textContent = score;
            break;
          }
        }
      }
    }

       // 🏁 TERMINATION DISPATCHER MATRIX
    function triggerTerminationSequence(reason) {
      gameOver = true;
      cancelAnimationFrame(animationFrameId);
      clearInterval(countdownIntervalId);

      // Evaluate and save new record metrics to local cache arrays
      if (score > highScore) {
        highScore = score;
        localStorage.setItem("survivor_high_score", highScore);
        highScoreEl.textContent = highScore;
      }

      // Configure overlay typography colors dynamically based on match criteria
      if (reason === "TIME_EXPIRED") {
        gameOverTitle.innerText = "VICTORY EXTRACTED";
        gameOverTitle.style.color = "#10b981"; // Success Emerald Green
      } else {
        gameOverTitle.innerText = "SYSTEM CRASHED";
        gameOverTitle.style.color = "#ef4444"; // Failure Crimson Red
      }

      // Render finalized analytics records to modal nodes
      finalScoreEl.textContent = score;
      finalHighEl.textContent = highScore;
      gameOverScreen.style.display = "flex";
    }

    // 🔄 SYSTEM RESTART CONTROLLER ENGINE
    function resetGameEngine() {
      // Flush object registers and data arrays
      score = 0;
      timeRemaining = 60;
      gameOver = false;
      projectiles = [];
      enemies = [];
      lastShotTime = 0;
      lastSpawnTime = 0;

      // Reset Player position coordinates to center deck
      player.x = canvas.width / 2;
      player.y = canvas.height / 2;

      // Sync display HUD interface metrics
      scoreEl.textContent = "0";
      timerEl.textContent = "60";
      gameOverScreen.style.display = "none";

      // Fire loops back online
      startTimerCountdown();
      animationFrameId = requestAnimationFrame(update);
    }

    // Initial Engine Startup Activation Callers
    startTimerCountdown();
    animationFrameId = requestAnimationFrame(update);
  </script>
</body>
</html>
